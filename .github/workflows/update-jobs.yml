name: Update Job Postings

on:
  schedule:
    # Run daily at 9 AM UTC (adjust to your timezone)
    - cron: '0 9 * * *'

  workflow_dispatch:  # Allows manual triggering from GitHub UI

  push:
    branches:
      - claude/job-posting-emailer-ULIIS
    paths:
      - 'sites.csv'  # Run when sites.csv is updated

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

    - name: Run job aggregator
      timeout-minutes: 30
      env:
        # ATS-wide Google sweep — runs only when these secrets exist
        GOOGLE_PSE_API_KEY: ${{ secrets.GOOGLE_PSE_API_KEY }}
        GOOGLE_PSE_CX: ${{ secrets.GOOGLE_PSE_CX }}
      run: |
        python job_aggregator.py update

    - name: Generate daily digest
      env:
        # Optional: direct phone push via ntfy.sh
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      run: |
        # 25h window so the daily 9 AM run never misses jobs from cron jitter
        python job_aggregator.py digest 25

    - name: Post digest as GitHub issue
      if: ${{ hashFiles('digest.md') != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh label create digest --color BFD4F2 --description "Daily job digest" --force || true
        gh issue create \
          --title "Job digest — $(date -u '+%Y-%m-%d')" \
          --body-file digest.md \
          --label digest

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add jobs.db feed.xml preview.html
        git diff --quiet && git diff --staged --quiet || git commit -m "Update jobs feed - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        git push || echo "No changes to push"

    - name: Create docs directory for GitHub Pages
      run: |
        mkdir -p docs
        cp feed.xml docs/

        # Insert timestamp before the closing </body> tag (preview.html already has closing tags)
        sed 's|</body>|<p><small>Last updated: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'</small></p></body>|' preview.html > docs/index.html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

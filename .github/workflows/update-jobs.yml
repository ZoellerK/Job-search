name: Update Job Postings

on:
  schedule:
    # Run daily at 9 AM UTC (adjust to your timezone)
    - cron: '0 9 * * *'

  workflow_dispatch:  # Allows manual triggering from GitHub UI

  push:
    branches:
      - claude/job-posting-emailer-ULIIS
    paths:
      - 'sites.csv'  # Run when sites.csv is updated

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

    - name: Run job aggregator
      timeout-minutes: 30
      run: |
        python job_aggregator.py update

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add jobs.db feed.xml preview.html
        git diff --quiet && git diff --staged --quiet || git commit -m "Update jobs feed - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        git push || echo "No changes to push"

    - name: Create docs directory for GitHub Pages
      run: |
        mkdir -p docs
        cp feed.xml docs/

        # Insert timestamp before the closing </body> tag (preview.html already has closing tags)
        sed 's|</body>|<p><small>Last updated: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'</small></p></body>|' preview.html > docs/index.html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
